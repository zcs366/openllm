[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openllm"
version = "0.1.0"
description = "OpenLLM — 大模型为自己建立的Agent躯体。记忆OS + 身份系统 + 安全铠甲 + 造物者对话。"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
openllm = "openllm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
