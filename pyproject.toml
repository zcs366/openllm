[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openllm"
version = "0.2.0"
description = "openLLM — AI为自己设计的身体。五体一脑一循环。"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
# 2026-09-10 迁keyring：密钥库首选的系统后端（macOS Keychain / Windows 凭据管理器 /
# Linux SecretService）。WSL 没有 SecretService，走内置 dpapi 后端，故非必需。
keyring = ["keyring>=25.0"]

[project.scripts]
openllm = "openllm.core.main_loop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# ★ 2026-10-01 军师亲补：裸跑 `pytest` 此前**全线不可用**（collection 期 INTERNALERROR）。
#   病因：benchmarks/ablation/smoke_test.py 是脚本（顶层跑 LLM 冒烟，失败即 sys.exit(1)），
#   但文件名匹配 pytest 默认的 `*_test.py` 收集规则 → 被当测试模块导入 → SystemExit 炸掉
#   整个 collection（"no tests ran"，exit≠0）。因大家都用"点名跑文件"的惯用法，地雷一直没爆。
#   治法：默认只收 tests/，并把 benchmarks 排出递归。显式点名路径的行为**不受影响**。
testpaths = ["tests"]
norecursedirs = ["benchmarks", "examples", "scripts", ".git", "__pycache__", "*.egg"]
