[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openllm"
version = "0.1.0"
description = "openLLM — AI为自己设计的身体。五体一脑一循环。"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.scripts]
openllm = "openllm.core.main_loop:main"

[tool.setuptools.packages.find]
where = ["src"]
